lang: en

project:
  type: website 
  pre-render: node scripts/pre-render-figures.cjs
  resources:
    - favicon.ico
    - components/includes/latex-macros.html
    - components/includes/latex-macros.tex
    - data/temp/titanic/test.csv
    - data/temp/titanic/train.csv
    - /images/square_on_back.png
    - /images/pacman.png
    - share/discourse/**
    - jslib/*
    - classes/*/discourse/**

website:
  title: "Mark's Math"
  llms-txt: true
  search: false
  site-url: https://marksmath.org/
  page-footer: "Written, owned, hosted, and copyright 2025, Mark McClure"
  navbar:
    collapse-below: md
    left:
      - href: scholarship/index.qmd
        text: Scholarship
      - href: visualization/index.qmd
        text: Viz
      - href: classes/index.qmd
        text: Class
      - href: https://legacy.marksmath.org/
        text: Legacy
    tools:
      - icon: linkedin
        href: https://www.linkedin.com/in/mark-mcclure-6739911a9/
        aria-label: "Mark's LinkedIn"

      - icon: github
        href: https://github.com/mcmcclur
        aria-label: "Mark's GitHub"

      - icon: bluesky
        href: https://bsky.app/profile/mark-mcclure.bsky.social
        aria-label: "Mark's Bluesky"

      - icon: chat-left-text
        href: https://blog.marksmath.org/
        aria-label: "The Blog @ Mark's Math"

      - icon: envelope
        href: mailto:mcmcclur@unca.edu
        aria-label: "Email Mark"
format: 
  html:
    include-in-header: mathjax-config.html
    toc: false
    anchor-sections: false
    respect-user-color-scheme: true
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    page-layout: full
    echo: false

execute:
  freeze: auto
  keep-ipynb: false
