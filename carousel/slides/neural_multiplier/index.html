<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A neural multiplier</title><link rel="stylesheet" href="../demo.css">
<style>
body { height: 100dvh; display: flex; flex-direction: column; }
h2 { margin-bottom: 0; }
#network { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; display: block; }
.node { stroke: var(--node-edge); stroke-width: 2; }
.node-value { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; fill: var(--demo-ink); }
.layer-name { font-size: 23px; fill: var(--demo-muted); text-anchor: middle; }
#equation { height: clamp(65px, 12vh, 110px); flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: clamp(24px, 4.4vw, 60px); font-variant-numeric: tabular-nums; }
#equation span { display: inline-block; opacity: 0; transform: translateY(8px) scale(0.96); }
</style></head><body>
<h2>A neural multiplier</h2>
<div id="network"></div>
<output id="equation" aria-live="polite" aria-label="Network multiplication result"><span></span></output>
<script type="module" src="demo.js"></script>
</body></html>
