<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water waves</title><link rel="stylesheet" href="../demo.css">
<style>
#demo { display: flex; flex-direction: column; height: calc(100dvh - 65px); }
#water { flex: 1; min-height: 160px; overflow: hidden; }
svg { display: block; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(#f69d3c, #ebf8e1, #3f87a6); border: 1px solid #7798a5; }
:root[data-theme="dark"] svg { background: linear-gradient(#191970, #303860, #101b2b); }
</style></head><body>
<h2>Water waves</h2>
<div id="demo">
<div class="controls">
<label>Amplitude <input id="A" aria-label="Amplitude" type="range" min="0" max="1" step="0.01"><output id="A_value"></output></label>
<label>Wavelength parameter α <input id="alpha" aria-label="Alpha" type="range" min="0" max="1" step="0.01"><output id="alpha_value"></output></label>
</div>
<div id="water"><svg role="img" aria-label="Water particles moving in circular orbits as a wave passes"></svg></div>
</div>
<script type="module">
import {state, ready, reportError} from '../slide-state.js';
try {
  const {do_it} = await import('./do_it.js');
  do_it(document.querySelector('#demo'), 1000, state);
  ready();
} catch (error) { reportError(error); }
</script></body></html>
