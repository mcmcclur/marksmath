    <script>
      function preprocessDiscourseMath() {
        document.querySelectorAll("span.math, div.math").forEach(function (node) {
          var tex = node.textContent || "";
          if (!tex.trim()) {
            return;
          }
          if (node.tagName === "SPAN") {
            node.textContent = "\\(" + tex + "\\)";
          } else {
            node.textContent = "\\[" + tex + "\\]";
          }
          node.classList.remove("math");
        });
      }

      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]]
        },
        startup: {
          pageReady() {
            preprocessDiscourseMath();
            return MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
