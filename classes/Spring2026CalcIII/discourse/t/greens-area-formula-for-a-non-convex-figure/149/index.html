    <script>
      function findSageCodeBlocks() {
        return Array.prototype.slice.call(
          document.querySelectorAll(
            "pre[data-code-wrap='sage'] > code, pre > code.lang-sage, pre > code.language-sage, pre > code.sage"
          )
        );
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var existing = document.querySelector("script[src='" + src + "']");
          if (existing) {
            if (existing.dataset.loaded === "true") {
              resolve();
              return;
            }
            existing.addEventListener("load", resolve, { once: true });
            existing.addEventListener("error", reject, { once: true });
            return;
          }

          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.addEventListener("load", function () {
            script.dataset.loaded = "true";
            resolve();
          }, { once: true });
          script.addEventListener("error", reject, { once: true });
          document.head.appendChild(script);
        });
      }

      function prepareSageCells() {
        var sageBlocks = findSageCodeBlocks();
        if (!sageBlocks.length) {
          return Promise.resolve();
        }

        return loadScript("https://sagecell.sagemath.org/static/embedded_sagecell.js")
          .then(function () {
            if (!window.sagecell || !window.sagecell.makeSagecell) {
              return;
            }

            sageBlocks.forEach(function (codeTag, index) {
              var preTag = codeTag.parentElement;
              if (!preTag || preTag.dataset.sageMounted === "true") {
                return;
              }

              var host = document.createElement("div");
              host.className = "sagecell-archive";

              var source = document.createElement("script");
              source.type = "text/x-sage";
              source.text = codeTag.textContent || "";
              host.appendChild(source);

              preTag.insertAdjacentElement("afterend", host);
              preTag.classList.add("sage-source-hidden");
              preTag.dataset.sageMounted = "true";

              window.sagecell.makeSagecell({
                inputLocation: host,
                autoeval: false,
                evalButtonText: "Run",
                languages: ["sage"]
              });
            });
          })
          .catch(function () {
            // Leave the original code blocks visible if SageCell cannot load.
          });
      }

      function preprocessDiscourseMath() {
        document.querySelectorAll("span.math, div.math").forEach(function (node) {
          var tex = node.textContent || "";
          if (!tex.trim()) {
            return;
          }
          if (node.tagName === "SPAN") {
            node.textContent = "\\(" + tex + "\\)";
          } else {
            node.textContent = "\\[" + tex + "\\]";
          }
          node.classList.remove("math");
        });
      }

      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]]
        },
        startup: {
          pageReady() {
            preprocessDiscourseMath();
            return MathJax.startup.defaultPageReady().then(function () {
              return prepareSageCells();
            });
          }
        }
      };
    </script>
    <script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
