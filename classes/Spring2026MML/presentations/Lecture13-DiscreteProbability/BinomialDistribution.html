<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<title>Binomial Distribution</title>
		<style>
			input {
				width: 160px;
			}
		</style>
	</head>
	<body>
		<div>
			<div id="n" style="display: inline-block; width:220px;">
			</div>
			<div id="p" style="display: inline-block; width:220px;">
			</div>
			<div id="N" style="display: inline-block; width:220px;">
			</div>
		</div>
		<div id="binomial_distribution"></div>
    <script type="module">
      import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@4/dist/runtime.js";
      import define from "https://api.observablehq.com/d/3e687413719d2ab6.js?v=3";
      (new Runtime).module(define, name => {
        if (name === "binomial_distribution") return Inspector.into("#binomial_distribution")();
        if (name === "viewof N") return Inspector.into("#N")();
        if (name === "viewof n") return Inspector.into("#n")();
        if (name === "viewof p") return Inspector.into("#p")();
      });
    </script>

	</body>
</html>
