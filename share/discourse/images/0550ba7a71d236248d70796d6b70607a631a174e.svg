<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="218" viewBox="40 25 200 218">
    <defs>
        <style>
            .unique-unicycle-wheel {
                transform-origin: 100px 150px;
                animation: unique-spin-wheel 2s linear infinite;
            }
            .unique-unicycle-crank-bg {
                transform-origin: 100px 150px;
                animation: unique-spin-crank-bg 2s linear infinite;
            }
            .unique-unicycle-crank-fg {
                transform-origin: 100px 150px;
                animation: unique-spin-crank-fg 2s linear infinite;
            }
            .unique-unicycle-pedal {
                transform-origin: 125px 150px;
                animation: unique-spin-pedal 2s linear infinite;
            }
            .unique-unicycle-loader {
                animation: unique-slide-loader 1.5s linear infinite;
            }

            @keyframes unique-spin-wheel {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes unique-spin-crank-bg {
                0% { transform: rotate(195deg); }
                100% { transform: rotate(555deg); }
            }
            @keyframes unique-spin-crank-fg {
                0% { transform: rotate(15deg); }
                100% { transform: rotate(375deg); }
            }
            @keyframes unique-spin-pedal {
                0% { transform: rotate(-22.5deg); }
                100% { transform: rotate(-382.5deg); }
            }
            @keyframes unique-slide-loader {
                0% { transform: translateX(0px); }
                100% { transform: translateX(210px); }
            }
        </style>
        <clipPath id="loaderClip">
            <rect x="70" y="235" width="140" height="8" rx="4"/>
        </clipPath>
    </defs>

    <g transform="translate(40, 0)">
        <g transform="rotate(7.5, 100, 150)">
            
            <g class="unique-unicycle-crank-bg">
                <rect x="100" y="147" width="25" height="6" rx="2" fill="var(--tertiary, #333)"/>
                <rect x="115" y="147" width="20" height="6" rx="1.5" fill="var(--tertiary, #333)" class="unique-unicycle-pedal"/>
            </g>

            <g class="unique-unicycle-wheel">
                <circle cx="100" cy="150" r="50" fill="none" stroke="var(--tertiary, #333)" stroke-width="10"/>
                <circle cx="100" cy="150" r="52" fill="none" stroke="var(--tertiary, #333)" stroke-width="8" stroke-dasharray="4, 6.4"/>

                <g stroke="var(--tertiary, #333)" stroke-width="0.8">
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(0, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(0, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(30, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(30, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(60, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(60, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(90, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(90, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(120, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(120, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(150, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(150, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(180, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(180, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(210, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(210, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(240, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(240, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(270, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(270, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(300, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(300, 100, 150)"/>
                    <line x1="97" y1="150" x2="103" y2="105" transform="rotate(330, 100, 150)"/>
                    <line x1="103" y1="150" x2="97" y2="105" transform="rotate(330, 100, 150)"/>
                </g>
            </g>

            <g fill="var(--tertiary, #333)">
                <path d="M 70 35 C 63 25, 85 22, 100 32 C 115 42, 138 42, 142 40 C 148 38, 148 50, 140 52 C 115 58, 85 55, 70 35 Z" transform="rotate(-15, 100, 55)"/>
                <rect x="97" y="40" width="6" height="45"/>
                <rect x="95" y="85" width="10" height="65" rx="2"/>
            </g>

            <g class="unique-unicycle-crank-fg">
                <rect x="100" y="147" width="25" height="6" rx="2" fill="var(--tertiary, #333)"/>
                <rect x="115" y="147" width="20" height="6" rx="1.5" fill="var(--tertiary, #333)" class="unique-unicycle-pedal"/>
            </g>

            <circle cx="100" cy="150" r="6" fill="white" stroke="var(--tertiary, #333)" stroke-width="3"/>
        </g>
    </g>

    <rect x="70" y="235" width="140" height="8" rx="4" fill="#e0e0e0"/>
    <g clip-path="url(#loaderClip)">
        <rect y="235" width="70" height="8" rx="4" fill="var(--tertiary, #333)" class="unique-unicycle-loader"/>
    </g>

</svg>
