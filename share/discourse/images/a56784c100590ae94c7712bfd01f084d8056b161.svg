<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Glow Filter for Tech Elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      
    </filter>

    <!-- Base Hexagon Node for the CPU/Berry -->
    <polygon id="hex" points="0,-8 6.9,-4 6.9,4 0,8 -6.9,4 -6.9,-4"/>
  </defs>

  <style>

    .bg-board { fill: #0f172a; stroke: #1e293b; stroke-width: 4; }
    .trace { stroke: #1e293b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hole { fill: #020617; stroke: #eab308; stroke-width: 2; }
    .port { fill: #1e293b; stroke: #334155; stroke-width: 2; }
    .pin { fill: #eab308; }


    .hex { opacity: 0.8; }
    .leaf { opacity: 0.9; }


    .spin-linear {
      transform-origin: 100px 100px;
      animation: spin 2s linear infinite;
    }
    .spin-reverse {
      transform-origin: 100px 100px;
      animation: spin-rev 3s linear infinite;
    }
    .spin-slow {
      transform-origin: 100px 100px;
      animation: spin 6s linear infinite;
    }


    .led-pwr { animation: blink-pwr 2.5s infinite; }
    .led-act { animation: blink-act 0.4s infinite; }


    .t1 { animation: pulse-color 2s ease-in-out infinite 0.0s; }
    .t2 { animation: pulse-color 2s ease-in-out infinite 0.3s; }
    .t3 { animation: pulse-color 2s ease-in-out infinite 0.6s; }

    .leaf-center { animation: pulse-leaf-color 2s ease-in-out infinite 0.0s; }
    .leaf-side   { animation: pulse-leaf-color 2s ease-in-out infinite 0.3s; }


    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-rev {
      100% { transform: rotate(-360deg); }
    }


    @keyframes pulse-color {
      0%, 100% { fill: #881337; opacity: 0.5; filter: drop-shadow(0px 0px 0px transparent); }
      50% { fill: #fb7185; opacity: 1; filter: drop-shadow(0px 0px 3px #f43f5e); }
    }
    @keyframes pulse-leaf-color {
      0%, 100% { fill: #14532d; opacity: 0.5; filter: drop-shadow(0px 0px 0px transparent); }
      50% { fill: #4ade80; opacity: 1; filter: drop-shadow(0px 0px 3px #22c55e); }
    }

    @keyframes blink-pwr {
      0%, 90%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #ef4444); }
      95% { opacity: 0.2; }
    }
    @keyframes blink-act {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #22c55e); }
    }
  </style>

  <!-- Main Board Background -->
  <rect x="10" y="10" width="180" height="180" rx="20" class="bg-board"/>

  <!-- Static Board Traces (Top/Bottom Corners) -->
  <path d="M 30 35 L 30 50 L 50 70" class="trace"/>
  <circle cx="50" cy="70" r="2" fill="#1e293b"/>
  <path d="M 170 35 L 170 50 L 150 70" class="trace"/>
  <circle cx="150" cy="70" r="2" fill="#1e293b"/>
  <path d="M 30 165 L 30 150 L 50 130" class="trace"/>
  <circle cx="50" cy="130" r="2" fill="#1e293b"/>
  <path d="M 170 165 L 170 150 L 150 130" class="trace"/>
  <circle cx="150" cy="130" r="2" fill="#1e293b"/>

  <!-- Corner Mounting Holes -->
  <circle cx="30" cy="30" r="4" class="hole"/>
  <circle cx="170" cy="30" r="4" class="hole"/>
  <circle cx="30" cy="170" r="4" class="hole"/>
  <circle cx="170" cy="170" r="4" class="hole"/>

  <!-- GPIO Header Pins (Top Edge) -->
  <g class="pin">
    <rect x="64" y="15" width="4" height="8" rx="1"/>
    <rect x="72" y="15" width="4" height="8" rx="1"/>
    <rect x="80" y="15" width="4" height="8" rx="1"/>
    <rect x="88" y="15" width="4" height="8" rx="1"/>
    <rect x="96" y="15" width="4" height="8" rx="1"/>
    <rect x="104" y="15" width="4" height="8" rx="1"/>
    <rect x="112" y="15" width="4" height="8" rx="1"/>
    <rect x="120" y="15" width="4" height="8" rx="1"/>
    <rect x="128" y="15" width="4" height="8" rx="1"/>
    <rect x="136" y="15" width="4" height="8" rx="1"/>
  </g>

  <!-- Peripherals / Ports (Bottom Edge) -->
  <rect x="50" y="175" width="25" height="15" rx="2" class="port"/>
  <rect x="85" y="175" width="30" height="15" rx="2" class="port"/>
  <rect x="125" y="175" width="25" height="15" rx="2" class="port"/>

  <!-- Status LEDs (PWR / ACT) -->
  <circle cx="25" cy="178" r="2" fill="#ef4444" class="led-pwr"/>
  <circle cx="33" cy="178" r="2" fill="#22c55e" class="led-act"/>

  <!-- Background CPU / Chip Socket outline -->
  <polygon points="100,32 145,58 145,145 100,171 55,145 55,58" fill="#020617" stroke="#1e293b" stroke-width="2"/>

  <!-- LOADING RINGS / SPINNERS -->

  <!-- Outer Dashboard Track (Slow) -->
  <g class="spin-slow">
    <circle cx="100" cy="100" r="76" stroke="#334155" stroke-width="2" stroke-dasharray="2 6" fill="none"/>
    <circle cx="100" cy="100" r="76" stroke="#eab308" stroke-width="3" stroke-dasharray="40 438" stroke-linecap="round" fill="none" transform="rotate(-90 100 100)"/>
  </g>

  <!-- Inner Green Data Track (Linear) -->
  <g class="spin-linear">
    <path d="M 100 32 A 68 68 0 0 1 168 100" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="168" cy="100" r="4" fill="#22c55e" filter="url(#glow)"/>
  </g>

  <!-- Innermost Red Data Tracks (Reverse) -->
  <g class="spin-reverse">
    <path d="M 100 40 A 60 60 0 0 0 40 100" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="100" r="3" fill="#f43f5e" filter="url(#glow)"/>

    <path d="M 100 160 A 60 60 0 0 0 160 100" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="160" cy="100" r="3" fill="#f43f5e" filter="url(#glow)"/>
  </g>

  <!-- CENTRAL BERRY CPU MATRIX -->

  <!-- Leaves -->
  <path d="M 100,70 L 85,40 L 100,52 L 115,40 Z" class="leaf leaf-center"/>
  <path d="M 92,72 L 80,52 L 60,40 L 65,60 Z" class="leaf leaf-side"/>
  <path d="M 108,72 L 120,52 L 140,40 L 135,60 Z" class="leaf leaf-side"/>

  <!-- Berry Data Hexagons (Arranged in classic 4-5-4-3-2 shape) -->

  <!-- Row 1 (Outer edge) -->
  <use href="#hex" x="73" y="80" class="hex t3"/>
  <use href="#hex" x="91" y="80" class="hex t3"/>
  <use href="#hex" x="109" y="80" class="hex t3"/>
  <use href="#hex" x="127" y="80" class="hex t3"/>

  <!-- Row 2 -->
  <use href="#hex" x="64" y="98" class="hex t3"/>
  <use href="#hex" x="82" y="98" class="hex t2"/>
  <use href="#hex" x="100" y="98" class="hex t1"/> <!-- Core Center -->
  <use href="#hex" x="118" y="98" class="hex t2"/>
  <use href="#hex" x="136" y="98" class="hex t3"/>

  <!-- Row 3 -->
  <use href="#hex" x="73" y="116" class="hex t2"/>
  <use href="#hex" x="91" y="116" class="hex t1"/> <!-- Core Center -->
  <use href="#hex" x="109" y="116" class="hex t1"/> <!-- Core Center -->
  <use href="#hex" x="127" y="116" class="hex t2"/>

  <!-- Row 4 -->
  <use href="#hex" x="82" y="134" class="hex t2"/>
  <use href="#hex" x="100" y="134" class="hex t1"/> <!-- Core Center -->
  <use href="#hex" x="118" y="134" class="hex t2"/>

  <!-- Row 5 (Outer edge) -->
  <use href="#hex" x="91" y="152" class="hex t3"/>
  <use href="#hex" x="109" y="152" class="hex t3"/>
</svg>
