    <style>
        .fade-text {
            animation: pulse 2.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .logo-breathe {
            animation: breathe 3s ease-in-out infinite alternate;
            transform-origin: center;
        }
        @keyframes breathe {
            0% { transform: translate(107.5px, 110px) scale(0.98); }
            100% { transform: translate(107.5px, 110px) scale(1.02); }
        }

        .float-1 { animation: float1 4s ease-in-out infinite alternate; }
        .float-2 { animation: float2 5s ease-in-out infinite alternate; }
        .float-3 { animation: float3 4.5s ease-in-out infinite alternate; }
        .float-4 { animation: float4 5.5s ease-in-out infinite alternate; }
        .float-5 { animation: float5 4.2s ease-in-out infinite alternate; }
        .float-6 { animation: float6 4.8s ease-in-out infinite alternate; }

        @keyframes float1 { 0% { transform: translate(40px, 40px); } 100% { transform: translate(40px, 25px); } }
        @keyframes float2 { 0% { transform: translate(500px, 50px); } 100% { transform: translate(500px, 65px); } }
        @keyframes float3 { 0% { transform: translate(30px, 150px); } 100% { transform: translate(30px, 135px); } }
        @keyframes float4 { 0% { transform: translate(510px, 160px); } 100% { transform: translate(510px, 175px); } }
        @keyframes float5 { 0% { transform: translate(60px, 260px); } 100% { transform: translate(60px, 245px); } }
        @keyframes float6 { 0% { transform: translate(490px, 270px); } 100% { transform: translate(490px, 255px); } }
    </style>

